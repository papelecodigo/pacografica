name: Validate ERP V5
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check erp-v5.js
          node --check erp-db.js
          node --check erp-data.js
      - name: Check required front files
        run: |
          test -s index.html
          test -s erp-v5.css
          test -s erp-v5.js
          test -s erp-db.js
          test -s erp-data.js
          test -s migration-v5-complete.sql
          grep -q 'erp-v5.js' index.html
          grep -q 'erp-v5.css' index.html
          grep -q 'section-dashboard' index.html
          grep -q 'section-customers' index.html
          grep -q 'section-quotes' index.html
          grep -q 'section-orders' index.html
          grep -q 'section-production' index.html
          grep -q 'section-tasks' index.html
          grep -q 'section-catalog' index.html
          grep -q 'section-stock' index.html
          grep -q 'section-finance' index.html
